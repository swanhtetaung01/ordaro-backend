spring.application.name=trillopos-backend

# The app pool connects as trillopos_app: owns nothing, no BYPASSRLS (spec §12 RLS, role split).
# Session mode or direct connection; never the transaction pooler (port 6543).
# Supavisor usernames carry the project ref: trillopos_app.<ref>.
spring.datasource.url=${TRILLOPOS_DB_URL:jdbc:postgresql://localhost:5432/trillopos}
spring.datasource.username=${TRILLOPOS_APP_USER:trillopos_app}
spring.datasource.password=${TRILLOPOS_APP_PASSWORD:}

# Flyway runs as trillopos_owner on its own connection, never through the app pool.
spring.flyway.url=${TRILLOPOS_DB_URL:jdbc:postgresql://localhost:5432/trillopos}
spring.flyway.user=${TRILLOPOS_OWNER_USER:trillopos_owner}
spring.flyway.password=${TRILLOPOS_OWNER_PASSWORD:}
spring.flyway.default-schema=trillopos
spring.flyway.schemas=trillopos
spring.flyway.create-schemas=false

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=trillopos
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

trillopos.jwt.issuer=${TRILLOPOS_JWT_ISSUER:trillopos}
trillopos.jwt.access-ttl=15m
trillopos.jwt.refresh-ttl=30d
trillopos.jwt.keys-file=${TRILLOPOS_JWT_KEYS_FILE:}
trillopos.tenant.membership-cache-ttl=30s

management.endpoints.web.exposure.include=health

# Blank: anyone may sign up. Set on a server open to the internet, and give the code only to the
# people who should create a shop there (the pilot: one shop and its staff).
trillopos.signup.code=${TRILLOPOS_SIGNUP_CODE:}

# A deploy lets requests in flight finish instead of cutting a checkout in half.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# OpenAPI JSON at /v3/api-docs for the web client. springdoc 3.1.1 (Boot 4.1). No Swagger UI.
# Off unless TRILLOPOS_OPENAPI=true (local .env sets it), so a deploy never publishes it by accident.
springdoc.api-docs.enabled=${TRILLOPOS_OPENAPI:false}
