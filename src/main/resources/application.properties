spring.application.name=ordaro-backend

# The app pool connects as ordaro_app: owns nothing, no BYPASSRLS (spec §12 RLS, role split).
# Session mode or direct connection; never the transaction pooler (port 6543).
# Supavisor usernames carry the project ref: ordaro_app.<ref>.
spring.datasource.url=${ORDARO_DB_URL:jdbc:postgresql://localhost:5432/ordaro}
spring.datasource.username=${ORDARO_APP_USER:ordaro_app}
spring.datasource.password=${ORDARO_APP_PASSWORD:}

# Flyway runs as ordaro_owner on its own connection, never through the app pool.
spring.flyway.url=${ORDARO_DB_URL:jdbc:postgresql://localhost:5432/ordaro}
spring.flyway.user=${ORDARO_OWNER_USER:ordaro_owner}
spring.flyway.password=${ORDARO_OWNER_PASSWORD:}
spring.flyway.default-schema=ordaro
spring.flyway.schemas=ordaro
spring.flyway.create-schemas=false

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=ordaro
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

ordaro.jwt.issuer=${ORDARO_JWT_ISSUER:ordaro}
ordaro.jwt.access-ttl=15m
ordaro.jwt.refresh-ttl=30d
ordaro.jwt.keys-file=${ORDARO_JWT_KEYS_FILE:}
ordaro.tenant.membership-cache-ttl=30s

management.endpoints.web.exposure.include=health

# Blank: anyone may sign up. Set on a server open to the internet, and give the code only to the
# people who should create a shop there (the pilot: one shop and its staff).
ordaro.signup.code=${ORDARO_SIGNUP_CODE:}

# A deploy lets requests in flight finish instead of cutting a checkout in half.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# OpenAPI JSON at /v3/api-docs for the web client. springdoc 3.1.1 (Boot 4.1). No Swagger UI.
# Off unless ORDARO_OPENAPI=true (local .env sets it), so a deploy never publishes it by accident.
springdoc.api-docs.enabled=${ORDARO_OPENAPI:false}
