# Local PostgreSQL for development (needs Docker; the tests do not — they use an embedded
# PostgreSQL). db/docker-init.sh runs db/bootstrap.sql once, on first start of the volume.
#   cp .env.example .env   # then fill in the passwords
#   docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ordaro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ORDARO_OWNER_PASSWORD: ${ORDARO_OWNER_PASSWORD:?set ORDARO_OWNER_PASSWORD in .env}
      ORDARO_APP_PASSWORD: ${ORDARO_APP_PASSWORD:?set ORDARO_APP_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - ./db/bootstrap.sql:/ordaro/bootstrap.sql:ro
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/10-ordaro-bootstrap.sh:ro
      - ordaro-pg:/var/lib/postgresql/data
volumes:
  ordaro-pg:
